<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Client Map — Responsive (v3)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    /* === Thème modifiable === */
    --color-primary:#4B0082; /* Passion Purple */
    --color-primary-dk:#380065;
    --color-muted:#777;
    --ui-bg:#f7f8fa;
    --ui-border:#d9dbe0;

    /* Couleurs POI selon règle de visite */
    --poi-recent:#16a34a;  /* vert */
    --poi-overdue:#dc2626; /* rouge */
    --poi-unknown:#4B0082; /* violet GE (passion purple) */

    --header-h:56px; /* mis à jour dynamiquement en JS */
    --panel-w:420px;  /* largeur du panneau en mobile */
  }
  html,body{height:100%;margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--ui-bg);color:#2d2d2d}

  /* --------  APP  -------- */
  #clientMapApp{display:grid;grid-template-rows:auto 1fr;height:100vh;contain:layout}

  /* header */
  .cm-header{position:sticky;top:0;z-index:1010;padding:.6rem .8rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--ui-border);background:#f4f5f7}
  .cm-header h1{margin:0;font-size:1.1rem;font-weight:600;color:var(--color-primary)}
  .cm-toggle{display:none;margin-right:.2rem}

  .cm-actions{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
  .btn{cursor:pointer;padding:.45rem .6rem;font-size:.9rem;border-radius:.5rem;border:1px solid #cfd2d6;background:#f4f5f7;transition:.2s}
  .btn:hover{background:#e8e9ec}
  .btn.primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
  .btn.primary:hover{background:#5b009a}
  .status{font-size:.8rem;color:var(--color-muted)}

  /* grille principale : panneau + carte (desktop) */
  .cm-grid{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0;position:relative}
  .cm-panel{border-right:1px solid var(--ui-border);padding:.8rem;overflow:auto;background:#fafbfc}
  .cm-map{width:100%;height:100%;min-height:0;position:relative}

  /* Form / UI */
  .cm-panel h2{margin:.4rem 0 .4rem;font-size:.95rem;color:var(--color-primary)}
  .cm-panel label{display:block;font-size:.85rem;margin-top:.45rem}
  .cm-panel input,.cm-panel select,.cm-panel textarea{width:100%;box-sizing:border-box;padding:.45rem .55rem;font-size:.9rem;border:1px solid #cfd2d6;border-radius:.45rem;background:#fff}
  .cm-row{display:grid;grid-template-columns:1fr auto;gap:.5rem}
  .cm-row-2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{border-bottom:1px solid #e5e7eb;padding:.4rem .35rem;text-align:left;vertical-align:top}
  th{background:#f4f5f7;position:sticky;top:0;z-index:1}

  /* Leaflet thème léger */
  .leaflet-bar a,.leaflet-bar a:hover{background:#f4f5f7;border-color:#cfd2d6;color:var(--color-primary)}
  .leaflet-bar a:hover{background:#e8e9ec}
  .leaflet-control-attribution{background:rgba(244,245,247,.9);color:var(--color-primary);border:1px solid var(--ui-border);padding:.1rem .3rem;border-radius:.3rem}
  .leaflet-popup-content-wrapper{border:1px solid #c9b3e3;box-shadow:0 6px 18px rgba(75,0,130,.12)}
  .leaflet-popup-tip{background:#fff;border:1px solid #c9b3e3}
  .leaflet-popup-content strong{color:var(--color-primary)}

  details summary{cursor:pointer;padding:.5rem .7rem;font-size:.9rem;border-radius:.5rem;border:1px solid #cfd2d6;background:#f4f5f7;transition:.2s;display:block;width:100%;box-sizing:border-box;margin-top:.6rem}
  details summary:hover{background:#e8e9ec}

  /* ===== Share menu (mobile) ===== */
  .share-wrap{position:relative}
  .share-menu{position:absolute;right:0;top:calc(100% + .3rem);background:#fff;border:1px solid var(--ui-border);border-radius:.5rem;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:.4rem;display:none;min-width:200px;z-index:1200}
  .share-menu .btn{width:100%;text-align:left;margin:.2rem 0}
  .btn-icon{display:inline-flex;align-items:center;gap:.35rem}
  .btn-icon svg{width:18px;height:18px;flex:none}

  /* ---------- Responsive (≤ 900px) ---------- */
  @media (max-width: 900px){
    .cm-header{gap:.35rem}
    .cm-header h1{font-size:1rem}
    .cm-toggle{display:inline-flex;align-items:center;gap:.35rem}

    .cm-grid{grid-template-columns:1fr;}
    .cm-map{height:calc(100vh - var(--header-h));}

    .cm-panel{position:absolute;z-index:1020;top:var(--header-h);left:0;width:min(100vw, var(--panel-w));height:calc(100vh - var(--header-h));box-shadow:0 12px 30px rgba(0,0,0,.18);transform:translateX(-106%);transition:transform .28s ease}
    #clientMapApp.panel-open .cm-panel{transform:translateX(0)}

    /* Cacher les deux gros boutons d'export sur mobile et les regrouper dans le menu partage */
    #btnExportCSV, #btnExportGeoJSON{display:none}
    #btnShare{display:inline-flex !important}
  }
  /* Desktop: le bouton partage est masqué, on montre les deux boutons export */
  #btnShare{display:none}

  @media (max-width: 360px){
    .btn{padding:.44rem .55rem;font-size:.85rem}
  }

  /* Surbrillance recherche */
  mark{ background:#ffeb3b66; padding:0 .12em; border-radius:.2em; }
</style>
</head>
<body>

<div id="clientMapApp">
  <div class="cm-header">
    <button id="btnTogglePanel" class="cm-toggle btn" aria-expanded="false" aria-controls="cm-panel" title="Afficher/Masquer le panneau">☰ Panneau</button>
    <h1 id="titleApp">Client Map</h1>

    <div class="cm-actions">
      <input type="file" id="fileInput" accept=".csv,.txt,.geojson,.json" />
      <button id="btnLoad" class="btn">Charger</button>

      <button id="btnExportCSV" class="btn">Exporter CSV</button>
      <button id="btnExportGeoJSON" class="btn">Exporter GeoJSON</button>

      <!-- Bouton Partage (mobile) -->
      <div class="share-wrap">
        <button id="btnShare" class="btn btn-icon" title="Partage / Export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7" />
            <path d="M16 6l-4-4-4 4" />
            <path d="M12 2v14" />
          </svg>
          Partage
        </button>
        <div id="shareMenu" class="share-menu" role="menu" aria-hidden="true">
          <button class="btn" data-act="x-export-csv">Exporter CSV</button>
          <button class="btn" data-act="x-export-gj">Exporter GeoJSON</button>
        </div>
      </div>

      <button id="btnSave" class="btn primary">Enregistrer…</button>
      <button id="btnAutosave" class="btn">Activer l’autosave</button>
      <span id="saveStatus" class="status"></span>
    </div>
  </div>

  <div class="cm-grid">
    <aside id="cm-panel" class="cm-panel" aria-label="Panneau latéral">
      <h2 id="titleSearch">Recherche d'adresse</h2>
      <div class="cm-row">
        <input id="fSearch" placeholder="Rechercher une adresse (OSM/Nominatim)" />
        <button id="btnSearch" class="btn">Rechercher</button>
      </div>
      <div class="cm-row" style="margin-top:.4rem">
        <div id="searchResults" class="status" style="font-size:.9rem;"></div>
        <button id="btnClearSearch" type="button" class="btn">Vider résultats</button>
      </div>

      <h2 id="titleForm">Ajouter / Modifier un Client</h2>
      <form id="clientForm">
        <label><span id="lblName">Nom du Client</span> <input id="fName" required /></label>
        <div class="cm-row-2">
          <label><span id="lblLat">Latitude</span>  <input id="fLat" type="number" step="any" required /></label>
          <label><span id="lblLng">Longitude</span> <input id="fLng" type="number" step="any" required /></label>
        </div>
        <label><span id="lblSystem">Système</span>
          <select id="fSystem">
            <option value="">—</option>
            <option>Systeme A</option>
            <option>Systeme B</option>
            <option>Systeme C</option>
          </select>
        </label>

        <label><span id="lblLastVisit">Date de la dernière visite</span>
          <input id="fLastVisit" type="date" />
        </label>

        <details>
          <summary>Plus d'informations / Contacts</summary>
          <div style="padding:.6rem 0 .2rem;">
            <label><span id="lblAddress">Adresse</span>  <input id="fAddress" placeholder="n°, rue, ville" /></label>
            <label><span id="lblPhone">Téléphone Client</span>  <input id="fPhone" placeholder="+33 ..." /></label>

            <h3 style="margin:.8rem 0 .4rem; font-size:.9rem; color:var(--color-primary-dk);" id="titleFE">Informations FE</h3>
            <label><span id="lblNomFE">Nom du FE</span> <input id="fNomFE" placeholder="Nom de l'ingénieur de terrain" /></label>
            <label><span id="lblPhoneFE">Téléphone FE</span> <input id="fPhoneFE" placeholder="+33 ..." /></label>

            <h3 style="margin:.8rem 0 .4rem; font-size:.9rem; color:var(--color-primary-dk);" id="titleContact">Contact Principal</h3>
            <label><span id="lblContactNom">Nom Contact</span> <input id="fContactNom" /></label>
            <div class="cm-row-2">
              <label><span id="lblContactPhone">Téléphone Contact</span> <input id="fContactPhone" placeholder="+33 ..." /></label>
              <label><span id="lblContactEmail">Email Contact</span> <input id="fContactEmail" placeholder="nom@exemple.com" /></label>
            </div>
            <label><span id="lblNotes">Notes</span>  <textarea id="fNotes" rows="3" placeholder="notes diverses"></textarea></label>
          </div>
        </details>

        <div class="cm-row" style="margin-top:.6rem;">
          <button class="btn primary" type="submit">Ajouter / Mettre à jour</button>
          <div style="display:flex;gap:.4rem;justify-content:flex-end">
            <button id="btnClear" type="button" class="btn">Vider</button>
            <button id="btnDeleteCurrent" type="button" class="btn" style="display:none">Supprimer</button>
          </div>
        </div>
        <div id="formMode" class="status" style="margin-top:.4rem"></div>
      </form>

      <div class="cm-row" style="margin:.6rem 0;">
        <input id="quickSearch" placeholder="Rechercher (ex: name:&quot;Dupont&quot; system:Alpha 'clinique centrale')" title="Recherche avancée : name: , system: , address: , contact: , last_visit: , etc." />
        <button id="btnClearQuick" type="button" class="btn">Effacer</button>
      </div>

      <h2 id="titleClients" style="margin-top:.2rem;">Clients</h2>
      <div style="overflow:auto; max-height:40vh; border:1px solid var(--ui-border); border-radius:.6rem;">
        <table>
          <thead>
            <tr><th>#</th><th>Nom</th><th>Système</th><th>Dernière visite</th><th>Actions</th></tr>
          </thead>
          <tbody id="clientTable"></tbody>
        </table>
      </div>

      <p class="status" style="margin-top:.6rem;">
        Clic gauche ou <b>clic droit</b> sur la carte → remplit Lat/Lng (aucune création auto).
      </p>
    </aside>

    <div id="cm-map" class="cm-map"></div>
  </div>
</div>

<script>
/* =========================
   Variables & Textes (à modifier facilement)
   ========================= */
const UI_TEXT = {
  titles: {
    app: 'Client Map',
    search: "Recherche d'adresse",
    form: 'Ajouter / Modifier un Client',
    fe: 'Informations FE',
    contact: 'Contact Principal',
    clients: 'Clients'
  },
  labels: {
    name: { label:'Nom du Client', placeholder:'' },
    lat: { label:'Latitude', placeholder:'' },
    lng: { label:'Longitude', placeholder:'' },
    system: { label:'Système', placeholder:'' },
    last_visit: { label:'Date de la dernière visite', placeholder:'' },
    address: { label:'Adresse', placeholder:'n°, rue, ville' },
    phone: { label:'Téléphone Client', placeholder:'+33 ...' },
    fe_name: { label:'Nom du FE', placeholder:"Nom de l'ingénieur de terrain" },
    fe_phone: { label:'Téléphone FE', placeholder:'+33 ...' },
    contact_name: { label:'Nom Contact', placeholder:'' },
    contact_phone: { label:'Téléphone Contact', placeholder:'+33 ...' },
    contact_email: { label:'Email Contact', placeholder:'nom@exemple.com' },
    notes: { label:'Notes', placeholder:'notes diverses' }
  }
};

// Thème / couleurs modifiables côté JS (en plus des variables CSS si besoin)
const THEME = {
  poiRecentColor: getComputedStyle(document.documentElement).getPropertyValue('--poi-recent').trim() || '#16a34a',
  poiOverdueColor: getComputedStyle(document.documentElement).getPropertyValue('--poi-overdue').trim() || '#dc2626',
  poiUnknownColor: getComputedStyle(document.documentElement).getPropertyValue('--poi-unknown').trim() || '#4B0082'
};

// Règle de calcul de l'échéance de visite (modifiable)
const VISIT_RULE = {
  refMonth: 11,  // 11 = Novembre
  refDay: 1      // 1 = 1er
};

// Configuration map
const CONFIG = {
  osmOnline: {
    urlTemplate: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    subdomains: ["a","b","c"],
    attribution: "© OpenStreetMap contributors",
    minZoom: 0, maxZoom: 19, center: [46.6, 2.5], initZoom: 6
  },
  localTiles: { urlTemplate: "./france-tiles/{z}/{x}/{y}.png", attribution: "Tuiles locales", minZoom: 0, maxZoom: 19 }
};

/* ============ State & helpers ============ */
const state = {
  map:null, markers:[], data:[],
  fileHandle:null, autosave:false, autosaveTimer:null, dirty:false,
  headers:["name","lat","lng","address","phone","notes","system","nom_fe","telephone_fe","contact_nom","contact_telephone","contact_email","last_visit"],
  editIndex:null, filterQuery:"", searchTerms:[]
};
const el = id => document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function setDirty(){ state.dirty = true; if (state.autosave) scheduleAutosave(); }
function setStatus(msg){ el("saveStatus").textContent = msg || ""; }

/* ============ UI text injection ============ */
function applyUIText(){
  el('titleApp').textContent = UI_TEXT.titles.app;
  el('titleSearch').textContent = UI_TEXT.titles.search;
  el('titleForm').textContent = UI_TEXT.titles.form;
  el('titleFE').textContent = UI_TEXT.titles.fe;
  el('titleContact').textContent = UI_TEXT.titles.contact;
  el('titleClients').textContent = UI_TEXT.titles.clients;

  const mapLbl = [
    ['lblName','name','fName'],
    ['lblLat','lat','fLat'],
    ['lblLng','lng','fLng'],
    ['lblSystem','system','fSystem'],
    ['lblLastVisit','last_visit','fLastVisit'],
    ['lblAddress','address','fAddress'],
    ['lblPhone','phone','fPhone'],
    ['lblNomFE','fe_name','fNomFE'],
    ['lblPhoneFE','fe_phone','fPhoneFE'],
    ['lblContactNom','contact_name','fContactNom'],
    ['lblContactPhone','contact_phone','fContactPhone'],
    ['lblContactEmail','contact_email','fContactEmail'],
    ['lblNotes','notes','fNotes']
  ];
  mapLbl.forEach(([lblKey, textKey, inputId])=>{
    const cfg = UI_TEXT.labels[textKey];
    if (cfg) {
      const lbl = el(lblKey); if (lbl) lbl.textContent = cfg.label;
      if (inputId) {
        const inp = el(inputId);
        if (inp && 'placeholder' in inp && cfg.placeholder!==undefined) inp.placeholder = cfg.placeholder;
      }
    }
  });
}

/* ============ Layout helpers (responsive) ============ */
function updateHeaderHeightVar(){
  const header = document.querySelector('#clientMapApp .cm-header');
  if(!header) return;
  const h = Math.round(header.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
function togglePanel(){
  const app = document.getElementById('clientMapApp');
  const btn = el('btnTogglePanel');
  const opened = app.classList.toggle('panel-open');
  btn.setAttribute('aria-expanded', String(opened));
  setTimeout(()=>{ if(state.map) state.map.invalidateSize(); }, 320);
}

/* ============ Map init ============ */
function initMap(){
  const osm = L.tileLayer(CONFIG.osmOnline.urlTemplate, {
    minZoom: CONFIG.osmOnline.minZoom, maxZoom: CONFIG.osmOnline.maxZoom,
    attribution: CONFIG.osmOnline.attribution, subdomains: CONFIG.osmOnline.subdomains
  });
  const esri = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics" }
  );
  const local = L.tileLayer(CONFIG.localTiles.urlTemplate, {
    minZoom: CONFIG.localTiles.minZoom, maxZoom: CONFIG.localTiles.maxZoom,
    attribution: CONFIG.localTiles.attribution, crossOrigin:true
  });

  state.map = L.map("cm-map", { layers:[osm] })
             .setView(CONFIG.osmOnline.center, CONFIG.osmOnline.initZoom);

  L.control.layers(
    { "OSM (en ligne)": osm, "Satellite (Esri)": esri, "Tuiles locales": local },
    null, { position:"topright" }
  ).addTo(state.map);

  const putLatLng = (latlng) => {
    el("fLat").value = latlng.lat.toFixed(6);
    el("fLng").value = latlng.lng.toFixed(6);
    el("fName").focus();
  };
  state.map.on("click", e => putLatLng(e.latlng));
  state.map.on("contextmenu", e => putLatLng(e.latlng));

  setTimeout(()=> state.map.invalidateSize(), 0);
  window.addEventListener("resize", ()=> { updateHeaderHeightVar(); state.map.invalidateSize(); });
  window.addEventListener("orientationchange", ()=> { updateHeaderHeightVar(); setTimeout(()=>state.map.invalidateSize(), 100); });
}

/* ============ Visites: statut + couleurs ============ */
function getVisitRefDate(){
  const now = new Date();
  const year = now.getFullYear() - 1; // année précédente
  return new Date(year, VISIT_RULE.refMonth - 1, VISIT_RULE.refDay); // JS: mois 0-11
}
function parseDate(s){
  if (!s) return null;
  const d = new Date(s);
  return isNaN(+d) ? null : d;
}
function getPoiColorByVisit(lastVisitStr){
  const ref = getVisitRefDate();
  const d = parseDate(lastVisitStr);
  if (!d) return THEME.poiUnknownColor; // date manquante = violet GE
  return d > ref ? THEME.poiRecentColor : THEME.poiOverdueColor;
}

/* ============ Icon factory ============ */
function makeIcon(color){
  const stroke = '#bfc1c7';
  const svg =
    "<svg xmlns='http://www.w3.org/2000/svg' width='24' height='32' viewBox='0 0 24 32'>" +
      "<defs><filter id='s' x='-20%' y='-20%' width='140%' height='140%'>" +
        "<feDropShadow dx='0' dy='2' stdDeviation='1.5' flood-opacity='.18'/>" +
      "</filter></defs>" +
      "<path filter='url(#s)' d='M12 31s-8-9.3-8-16A8 8 0 1 1 20 15c0 6.7-8 16-8 16Z' fill='"+color+"' stroke='"+stroke+"' stroke-width='1.2'/>" +
      "<circle cx='12' cy='12' r='3.6' fill='#fff'/>" +
    "</svg>";
  return L.icon({ iconUrl: "data:image/svg+xml," + encodeURIComponent(svg), iconSize:[24,32], iconAnchor:[12,31], popupAnchor:[0,-28] });
}

/* ============ Recherche avancée + surbrillance ============ */
function escapeRegExp(str){ return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function parseAdvancedQuery(q){
  const text = (q||'').trim();
  const tokens = text.match(/(?:\w+:(?:\"[^\"]+\"|'[^']+'|\S+)|\"[^\"]+\"|'[^']+'|\S+)/g) || [];
  const clauses = []; const terms = [];
  const fieldMap = {
    name:'name', system:'system', last_visit:'last_visit', date:'last_visit',
    address:'address', phone:'phone', notes:'notes',
    nom_fe:'nom_fe', fe_name:'nom_fe', telephone_fe:'telephone_fe', fe_phone:'telephone_fe',
    contact:'contact_all', contact_nom:'contact_nom', contact_name:'contact_nom',
    contact_phone:'contact_telephone', contact_tel:'contact_telephone',
    contact_email:'contact_email', email:'contact_email'
  };
  tokens.forEach(tok=>{
    const m = tok.match(/^(\w+):(.*)$/);
    if (m){
      const field = fieldMap[m[1].toLowerCase()];
      let val = m[2].replace(/^["']|["']$/g,'');
      if (!field || !val) return;
      const low = val.toLowerCase();
      clauses.push(d=>{
        if (field==='contact_all'){
          return ['contact_nom','contact_telephone','contact_email'].some(k=>String(d[k]||'').toLowerCase().includes(low));
        }
        return String(d[field]||'').toLowerCase().includes(low);
      });
      terms.push(val);
    } else {
      const val = tok.replace(/^["']|["']$/g,'');
      if (!val) return;
      const low = val.toLowerCase();
      clauses.push(d=>{
        return Object.entries(d).some(([k,v])=>{
          if (k==='lat' || k==='lng') return false; // exclure coords
          return String(v||'').toLowerCase().includes(low);
        });
      });
      terms.push(val);
    }
  });
  return { predicate: d=>clauses.every(fn=>fn(d)), terms };
}
function getFilteredData(){
  const q = state.filterQuery||'';
  if (!q.trim()) { state.searchTerms=[]; return state.data; }
  const { predicate, terms } = parseAdvancedQuery(q);
  state.searchTerms = terms;
  return state.data.filter(predicate);
}
function highlightText(text){
  if (!state.searchTerms || !state.searchTerms.length) return esc(text||'');
  let out = esc(text||'');
  state.searchTerms.forEach(t=>{
    const pattern = new RegExp(escapeRegExp(esc(t)), 'gi');
    out = out.replace(pattern, (m)=>'<mark>'+m+'</mark>');
  });
  return out;
}

/* ============ Rendu ============ */
function buildPopupHTML(idx, d){
  const nm = highlightText(d.name||'');
  const sys = highlightText(d.system||'');
  const lv  = highlightText(d.last_visit||'');
  const cn  = highlightText(d.contact_nom||'');
  const minimal = `
    <div>
      <strong>${nm}</strong><br>
      <small>Système : ${sys}</small><br>
      <small>Dernière visite : ${lv} </small><br>
      <small>Contact : ${cn} </small>
    </div>
    <div style="margin-top:.5rem">
      <button class="btn" data-act="more" data-idx="${idx}">Tout afficher</button>
      <button class="btn" data-act="edit" data-idx="${idx}">Éditer</button>
      <button class="btn" data-act="fly" data-idx="${idx}">Voir</button>
    </div>
    <div id="pp-more-${idx}" style="display:none;margin-top:.5rem;font-size:.9rem">
      <hr style="border:none;border-top:1px solid #eee;margin:.4rem 0"/>
      <div><b>Adresse :</b> ${highlightText(d.address||'')}</div>
      <div><b>Téléphone Client :</b> ${highlightText(d.phone||'')}</div>
      <div><b>Notes :</b> ${highlightText(d.notes||'')}</div>
      <div><b>Nom FE :</b> ${highlightText(d.nom_fe||'')}</div>
      <div><b>Téléphone FE :</b> ${highlightText(d.telephone_fe||'')}</div>
      <div><b>Contact (nom) :</b> ${highlightText(d.contact_nom||'')}</div>
      <div><b>Contact (téléphone) :</b> ${highlightText(d.contact_telephone||'')}</div>
      <div><b>Contact (email) :</b> ${highlightText(d.contact_email||'')}</div>
    </div>
  `;
  return minimal;
}
function renderMarkers(){
  state.markers.forEach(m => state.map.removeLayer(m)); state.markers = [];
  const rows = getFilteredData();
  rows.forEach(d => {
    const lat = +d.lat, lng = +d.lng;
    if (!isFinite(lat) || !isFinite(lng)) return;
    const color = getPoiColorByVisit(d.last_visit);
    const m = L.marker([lat,lng], { icon: makeIcon(color) }).addTo(state.map);

    const idx = state.data.indexOf(d);
    m.bindPopup(buildPopupHTML(idx, d));
    m.on("click", () => selectRow(idx));
    state.markers.push(m);
  });

  // wire 'more' button on popup open
  state.map.on('popupopen', (e)=>{
    const root = e.popup.getElement();
    if (!root) return;
    const moreBtn = root.querySelector("button[data-act='more']");
    if (moreBtn) {
      moreBtn.addEventListener('click', ()=>{
        const idx = moreBtn.getAttribute('data-idx');
        const moreDiv = root.querySelector('#pp-more-'+idx);
        if (moreDiv) {
          const visible = moreDiv.style.display !== 'none';
          moreDiv.style.display = visible ? 'none' : 'block';
          moreBtn.textContent = visible ? 'Tout afficher' : 'Réduire';
        }
      });
    }
  });
}
function renderTable(){
  const tb = el("clientTable"); tb.innerHTML = "";
  const rows = getFilteredData();
  rows.forEach(d => {
    const i = state.data.indexOf(d);
    const tr = document.createElement("tr"); 
    tr.innerHTML =
      `<td>${i+1}</td>`+
      `<td>${highlightText(d.name||'')}</td>`+
      `<td>${highlightText(d.system||'')}</td>`+
      `<td>${highlightText(d.last_visit||'')}</td>`+
      `<td>`+
        `<button class='btn' data-act='fly'  data-idx='${i}'>Voir</button> `+
        `<button class='btn' data-act='edit' data-idx='${i}'>Éditer</button>`+
      `</td>`;
    tb.appendChild(tr);
  });
}
function refresh(){ renderMarkers(); renderTable(); }

/* ============ Form / CRUD ============ */
function showFormMode(){
  el("formMode").textContent = (state.editIndex===null ? "Mode : ajout d'un Client" : "Mode : édition (ligne "+(state.editIndex+1)+")");
  const delBtn = el("btnDeleteCurrent");
  if (delBtn) delBtn.style.display = (state.editIndex===null ? 'none' : 'inline-block');
}
function selectRow(i){
  state.editIndex = i;
  const d = state.data[i];
  el("fName").value = d.name || "";
  el("fLat").value = d.lat || "";
  el("fLng").value = d.lng || "";
  el("fAddress").value = d.address || "";
  el("fPhone").value = d.phone || "";
  el("fNotes").value = d.notes || "";
  el("fSystem").value = d.system || "";
  el("fNomFE").value = d.nom_fe || "";
  el("fPhoneFE").value = d.telephone_fe || "";
  el("fContactNom").value = d.contact_nom || "";
  el("fContactPhone").value = d.contact_telephone || "";
  el("fContactEmail").value = d.contact_email || "";
  el("fLastVisit").value = (d.last_visit || '').substring(0,10);

function clearForm(){
  el("clientForm").reset();
  el("fLastVisit").value = new Date().toISOString().slice(0,10);

function addOrUpdateFromForm(){
  const r = {
    name: el("fName").value.trim(),
    lat: el("fLat").value.trim(),
    lng: el("fLng").value.trim(),
    system: el("fSystem").value.trim(),
    last_visit: el("fLastVisit").value.trim(),
    address: el("fAddress").value.trim(),
    phone: el("fPhone").value.trim(),
    notes: el("fNotes").value.trim(),
    nom_fe: el("fNomFE").value.trim(),
    telephone_fe: el("fPhoneFE").value.trim(),
    contact_nom: el("fContactNom").value.trim(),
    contact_telephone: el("fContactPhone").value.trim(),
    contact_email: el("fContactEmail").value.trim()
  };

  else { state.data.push(r); }
  state.editIndex = null;
  showFormMode();
  setDirty();
  refresh();
}

/* ============ CSV & GeoJSON ============ */
function toCSV(rows, headers){
  const escV = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const head = headers.join(",");
  const body = rows.map(r => headers.map(h => escV(r[h])).join(",")).join("\n");
  return head + "\n" + body;
}
function parseCSV(text){
  const rows=[]; let i=0, cur="", row=[], inQ=false;
  const pushCell=()=>{ row.push(cur); cur=""; }, pushRow=()=>{ rows.push(row); row=[]; };
  while(i<text.length){
    const ch=text[i++];
    if(inQ){
      if(ch==='"'){ if(text[i]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===',') pushCell();
      else if(ch==='\n'){ pushCell(); pushRow(); }
      else if(ch==='\r'){ /* skip */ }
      else cur+=ch;
    }
  }
  pushCell();
  const headers=(rows.shift()||[]).map(h=>(h||"").trim().toLowerCase());
  return rows.filter(r=>r.length>1 || (r[0] && r[0].trim())).map(r=>{
    const o={}; headers.forEach((h,idx)=> o[h]=(r[idx]||"").trim());
    return {
      name:o.name||o.titre||o.label||"", lat:o.lat||o.latitude||"", lng:o.lng||o.lon||o.long||o.longitude||"", 
      address:o.address||o.adresse||"", phone:o.phone||o.telephone||o["téléphone"]||"", notes:o.notes||o.description||o.desc||"", 
      system:o.system||o["système"]||o.categorie||o.category||"", 
      nom_fe:o.nom_fe||o.fe_name||o.fe_nom||"", telephone_fe:o.telephone_fe||o.phone_fe||o.fe_phone||"", 
      contact_nom:o.contact_nom||o.contact_name||o.contacte_principal||"", contact_telephone:o.contact_telephone||o.contact_phone||"", contact_email:o.contact_email||o.contact_mail||o.email||"", 
      last_visit:o.last_visit||o["derniere_visite"]||o["dernière_visite"]||o["date_derniere_visite"]||o["date_dernière_visite"]||""
    };
  });
}
function toGeoJSON(rows){
  return {
    type:"FeatureCollection",
    features: rows.filter(d=>isFinite(+d.lat)&&isFinite(+d.lng)).map(d=>({
      type:"Feature",
      properties:{
        name:d.name||"", address:d.address||"", phone:d.phone||"", notes:d.notes||"", system:d.system||"", 
        nom_fe:d.nom_fe||"", telephone_fe:d.telephone_fe||"", contact_nom:d.contact_nom||"", contact_telephone:d.contact_telephone||"", contact_email:d.contact_email||"", 
        last_visit:d.last_visit||""
      },
      geometry:{ type:"Point", coordinates:[ +d.lng, +d.lat ] }
    }))
  };
}
function parseGeoJSON(text){
  let gj; try{ gj=JSON.parse(text); }catch{ return []; }
  if (!gj || gj.type!=="FeatureCollection" || !Array.isArray(gj.features)) return [];
  return gj.features.map(f=>{
    const p=f.properties||{}, g=f.geometry||{};
    if (!g || g.type!=="Point" || !Array.isArray(g.coordinates)) return null;
    const lng=+g.coordinates[0], lat=+g.coordinates[1];
    if (!isFinite(lat)||!isFinite(lng)) return null;
    return {
      name:p.name||"", address:p.address||"", phone:p.phone||"", notes:p.notes||"", system:p.system||"", 
      lat:String(lat), lng:String(lng),
      nom_fe:p.nom_fe||"", telephone_fe:p.telephone_fe||"", contact_nom:p.contact_nom||"", contact_telephone:p.contact_telephone||"", contact_email:p.contact_email||"", 
      last_visit:p.last_visit||""
    };
  }).filter(Boolean);
}
function downloadBlob(filename, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function exportCSV(){
  downloadBlob("clients.csv", new Blob([toCSV(state.data,state.headers)],{type:"text/csv"}));
}
function exportGeoJSON(){
  downloadBlob("clients.geojson", new Blob([JSON.stringify(toGeoJSON(state.data),null,2)],{type:"application/geo+json"}));
}

/* ============ File System Access ============ */
async function writeToHandle(){
  const w = await state.fileHandle.createWritable();
  await w.write(toCSV(state.data, state.headers));
  await w.close();
  setStatus("Enregistré "+new Date().toLocaleTimeString());
  state.dirty = false;
}
async function saveWithFSAccess(){
  if (!("showSaveFilePicker" in window)) { alert("Navigateur non compatible (File System Access)"); return; }
  if (!state.fileHandle){
    state.fileHandle = await window.showSaveFilePicker({
      suggestedName:"clients.csv",
      types:[{ description:"CSV", accept:{ "text/csv": [".csv"] } }]
    });
  }
  try{ await writeToHandle(); }catch(e){ console.error(e); setStatus("Erreur d'enregistrement"); }
}
function scheduleAutosave(){
  if (!state.fileHandle) return;
  if (state.autosaveTimer) return;
  state.autosaveTimer = setTimeout(async ()=>{
    state.autosaveTimer = null;
    if (state.dirty && state.autosave){
      try{ await writeToHandle(); }catch(e){ console.error(e); setStatus("Autosave: erreur"); }
    }
  }, 1500);
}
async function toggleAutosave(){
  if (!state.autosave){
    if (!("showSaveFilePicker" in window)) { alert("Navigateur non compatible (File System Access)"); return; }
    if (!state.fileHandle){
      state.fileHandle = await window.showSaveFilePicker({
        suggestedName:"clients.csv",
        types:[{ description:"CSV", accept:{ "text/csv": [".csv"] } }]
      });
    }
    state.autosave = true;
    el("btnAutosave").textContent = "Désactiver l’autosave";
    setStatus("Autosave actif");
    if (state.dirty) scheduleAutosave();
  } else {
    state.autosave = false;
    el("btnAutosave").textContent = "Activer l’autosave";
    setStatus("Autosave arrêté");
  }
}

/* ============ Recherche (Nominatim) ============ */
async function doSearch(){
  const q = el("fSearch").value.trim(); if (!q) return;
  el("searchResults").textContent = "Recherche…";
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q="+encodeURIComponent(q);
  try{
    const res = await fetch(url, { headers:{ "Accept":"application/json" } });
    const data = await res.json();
    renderSearchResults(data);
  }catch(err){
    console.error(err);
    el("searchResults").textContent = "Erreur de recherche";
  }
}
function renderSearchResults(items){
  const box = el("searchResults"); box.innerHTML = "";
  if (!items || !items.length){ box.textContent = "Aucun résultat"; return; }
  const wrap = document.createElement("div");
  items.forEach(it=>{
    const line=document.createElement("div"); line.style.padding=".25rem 0";
    const name=document.createElement("div"); name.textContent=it.display_name; name.style.marginBottom=".2rem";
    const btns=document.createElement("div");
    const bGo=document.createElement("button"); bGo.className='btn'; bGo.textContent="Aller";
    bGo.addEventListener("click", ()=> state.map.setView([+it.lat,+it.lon], 18));
    const bUse=document.createElement("button"); bUse.className='btn'; bUse.textContent="Coord."; bUse.style.marginLeft=".4rem";
    bUse.addEventListener("click", ()=>{
      el("fLat").value=(+it.lat).toFixed(6);
      el("fLng").value=(+it.lon).toFixed(6);
      el("fName").focus();
    });
    btns.appendChild(bGo); btns.appendChild(bUse);
    line.appendChild(name); line.appendChild(btns);
    wrap.appendChild(line);
  });
  box.appendChild(wrap);
}

/* ============ Import (CSV/TXT/GeoJSON) ============ */
async function doLoadSelectedFile(){
  const f = el("fileInput").files && el("fileInput").files[0];
  if (!f) return alert("Choisissez un fichier CSV/TXT/GeoJSON.");
  const ext = (f.name.split(".").pop()||"").toLowerCase();
  const text = await f.text();
  let rows = [];
  if (ext==="csv" || ext==="txt") rows = parseCSV(text);
  else rows = parseGeoJSON(text);
  if (!rows.length) { alert("Aucune donnée client reconnue."); return; }
  state.data = rows;
  setDirty();
  refresh();
}

/* ============ Events & Boot ============ */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const act = b.dataset.act;
  if (act === "del") { state.data.splice(+b.dataset.idx, 1); setDirty(); refresh(); }
  if (act === "edit"){ selectRow(+b.dataset.idx); }
  if (act === "fly") { const d = state.data[+b.dataset.idx]; if (d) state.map.setView([+d.lat,+d.lng], 18); }

  if (act === 'x-export-csv') exportCSV();
  if (act === 'x-export-gj') exportGeoJSON();
});
el("clientForm").addEventListener("submit", e => { e.preventDefault(); addOrUpdateFromForm(); });
el("btnClear").addEventListener("click", clearForm);
const btnDel = el('btnDeleteCurrent');
if (btnDel){
  btnDel.addEventListener('click', ()=>{
    if (state.editIndex!==null){
      const i = state.editIndex;
      const d = state.data[i];
      if (confirm(`Supprimer la ligne ${i+1} : ${d && d.name ? d.name : ''} ?`)){
        state.data.splice(i,1);
        state.editIndex = null;
        setDirty();
        refresh();
        clearForm();
      }
    }
  });
}
el("btnLoad").addEventListener("click", doLoadSelectedFile);
el("btnExportCSV").addEventListener("click", exportCSV);
el("btnExportGeoJSON").addEventListener("click", exportGeoJSON);
el("btnSave").addEventListener("click", saveWithFSAccess);
el("btnAutosave").addEventListener("click", () => { toggleAutosave(); });
el("btnSearch").addEventListener("click", () => { el("searchResults").innerHTML=""; doSearch(); });
el("fSearch").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); el("searchResults").innerHTML=""; doSearch(); } });
el("btnClearSearch").addEventListener("click", () => { el("searchResults").innerHTML=""; el("fSearch").value=""; });
// Quick search (live)
const qs = el('quickSearch');
if (qs){
  qs.addEventListener('input', e => { state.filterQuery = e.target.value; refresh(); });
  if (!qs.getAttribute('title')){
    qs.setAttribute('title', "Recherche avancée — Exemples : name:\"Dupont\" system:Alpha contact:dupont 'clinique centrale'");
  }
}
const bq = el('btnClearQuick');
if (bq){ bq.addEventListener('click', ()=>{ if (qs){ qs.value=''; } state.filterQuery=''; state.searchTerms=[]; refresh(); }); }

// toggle panneau (mobile)
el("btnTogglePanel").addEventListener("click", togglePanel);

// share menu (mobile)
const shareBtn = el('btnShare');
const shareMenu = el('shareMenu');
if (shareBtn && shareMenu) {
  shareBtn.addEventListener('click', (e)=>{
    const open = shareMenu.style.display === 'block';
    shareMenu.style.display = open ? 'none' : 'block';
    shareMenu.setAttribute('aria-hidden', open ? 'true':'false');
  });
  document.addEventListener('click', (e)=>{
    if (!shareMenu.contains(e.target) && e.target !== shareBtn && !shareBtn.contains(e.target)) {
      shareMenu.style.display = 'none';
      shareMenu.setAttribute('aria-hidden','true');
    }
  });
}

// Boot
applyUIText();
initMap();
refresh();
showFormMode();
updateHeaderHeightVar();
// date par défaut pour le champ visite (si vide)
if (!el('fLastVisit').value) el('fLastVisit').value = new Date().toISOString().slice(0,10);

if ('fonts' in document) { try { document.fonts.ready.then(updateHeaderHeightVar); } catch(_){} }
</script>
